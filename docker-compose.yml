services:
  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - API_KEY=${API_KEY}
      - VIEW_PASSWORD=${VIEW_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PHOTO_DIR=/data/photos
      - DB_PATH=/data/wook2woke.db
    volumes:
      - app_data:/data
    restart: unless-stopped

volumes:
  app_data:
